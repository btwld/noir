name: noir
description: A Flutter-like reactive terminal UI framework for Dart, powered by OpenTUI.
version: 0.0.1-alpha.0
repository: https://github.com/leoafarias/noir
issue_tracker: https://github.com/leoafarias/noir/issues

topics:
  - tui
  - terminal
  - cli
  - widgets
  - ffi

environment:
  sdk: '>=3.10.0 <4.0.0'

platforms:
  linux:
  macos:
  windows:

dependencies:
  characters: ^1.3.0
  code_assets: ^1.1.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  hooks: ^2.0.0
  meta: ^1.12.0

dev_dependencies:
  analyzer: ^8.2.0
  archive: ^4.0.0
  ffigen: ^15.0.0
  # Keep pub-downgrade test execution compatible with Dart 3.10.
  frontend_server_client: ^4.0.0
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.25.0
  # Drives `reloadSources` + `ext.noir.reassemble` from the hot-reload dev
  # driver and its end-to-end test. Already resolved transitively at 15.2.0.
  vm_service: ^15.2.0
