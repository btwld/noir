name: noir
description: A Flutter-like reactive terminal UI framework for Dart, powered by OpenTUI.
version: 0.1.0
repository: https://github.com/leoafarias/noir
issue_tracker: https://github.com/leoafarias/noir/issues

topics:
  - tui
  - terminal
  - cli
  - widgets
  - ffi

environment:
  sdk: '>=3.10.0 <4.0.0'

platforms:
  linux:
  macos:
  windows:

dependencies:
  characters: ^1.3.0
  code_assets: ^1.1.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  hooks: ^2.0.0
  meta: ^1.12.0

dev_dependencies:
  analyzer: ^8.2.0
  lints: ^3.0.0
  test: ^1.25.0
  ffigen: ^15.0.0
  path: ^1.9.0

ffigen:
  name: OpenTuiBindings
  description: Auto-generated bindings for OpenTUI
  output: 'lib/src/ffi/generated_bindings.dart'

  headers:
    entry-points:
      - 'external/opentui/packages/go/opentui.h'

  functions:
    include:
      - '.*'

  structs:
    include:
      - 'Capabilities'

  comments:
    style: any
    length: full

  preamble: |
    // Generated FFI bindings for OpenTUI from external/opentui/packages/go/opentui.h.
    // Regenerate with: dart run ffigen
    // Do not edit manually.
