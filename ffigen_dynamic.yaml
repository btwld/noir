name: OpenTuiBindings
description: Auto-generated bindings for OpenTUI
output: 'lib/src/ffi/generated_bindings.dart'

headers:
  entry-points:
    - 'external/opentui/packages/go/opentui.h'

functions:
  include:
    - '.*'

structs:
  include:
    - 'Capabilities'

comments:
  style: any
  length: full

preamble: |
  // Generated FFI bindings for OpenTUI from external/opentui/packages/go/opentui.h.
  // Regenerate with: dart run ffigen --config ffigen_dynamic.yaml
  // Do not edit manually.
  // ignore_for_file: unused_element, unused_field
