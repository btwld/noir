name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Configure pub cache
        shell: bash
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-Dart-3.10.0-${{ hashFiles('pubspec.yaml', 'packages/noir_signals/pubspec.yaml') }}

      - name: Install dependencies
        timeout-minutes: 3
        run: dart pub get

      - name: Check formatting
        timeout-minutes: 2
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/ bin/ hook/ scripts/

      - name: Run strict analysis
        timeout-minutes: 4
        run: dart analyze --fatal-infos

      - name: Check companion formatting
        timeout-minutes: 2
        working-directory: packages/noir_signals
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/

      - name: Run strict companion analysis
        timeout-minutes: 4
        working-directory: packages/noir_signals
        run: dart analyze --fatal-infos

  website:
    name: Validate website
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Check generated documentation
        run: npm run sync:check

      - name: Install browser
        timeout-minutes: 4
        run: npx --no-install playwright install --with-deps chromium

      - name: Check website formatting
        run: npm run format:check

      - name: Lint website
        run: npm run lint

      - name: Check website types
        run: npm run typecheck

      - name: Build static website
        env:
          NOIR_WEBSITE_BASE_PATH: /noir
        run: npm run build

      - name: Run website smoke test
        env:
          NOIR_WEBSITE_BASE_PATH: /noir
        run: npm run test:smoke

  ubuntu-test:
    name: Test (Ubuntu)
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Configure pub cache
        shell: bash
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-Dart-3.10.0-${{ hashFiles('pubspec.yaml', 'packages/noir_signals/pubspec.yaml') }}

      - name: Install dependencies
        timeout-minutes: 3
        run: dart pub get

      - name: Verify bundled native assets
        timeout-minutes: 2
        run: dart run scripts/fetch_opentui_binaries.dart --verify-only

      - name: Run ordinary tests
        # The serial suite compiles consumer packages and MCP fixture servers.
        # Windows finished in 9m56s under the previous 10-minute ceiling and
        # was killed while the process was still exiting.
        timeout-minutes: 15
        run: dart test --concurrency=1

      - name: Run companion tests
        timeout-minutes: 4
        working-directory: packages/noir_signals
        run: dart test --concurrency=1

  desktop-test:
    name: Test (${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Configure pub cache
        shell: bash
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-Dart-3.10.0-${{ hashFiles('pubspec.yaml', 'packages/noir_signals/pubspec.yaml') }}

      - name: Install dependencies
        timeout-minutes: 3
        run: dart pub get

      - name: Verify bundled native assets
        timeout-minutes: 2
        run: dart run scripts/fetch_opentui_binaries.dart --verify-only

      - name: Run ordinary tests
        # A loaded macOS runner exceeded 15 minutes without an assertion failure.
        timeout-minutes: 20
        run: dart test --concurrency=1

      - name: Run companion tests
        timeout-minutes: 4
        working-directory: packages/noir_signals
        run: dart test --concurrency=1
