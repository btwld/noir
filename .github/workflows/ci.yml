name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.0'

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/ bin/

      - name: Run static analysis
        run: dart analyze --fatal-infos

  test:
    name: Test & Render (${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.0'

      - name: Install dependencies
        run: dart pub get

      - name: Health check (native library load + render smoke)
        run: dart run bin/health_check.dart

      - name: Run tests
        run: dart test --exclude-tags process-spawning --concurrency=1

  parity:
    name: Architecture & Go Parity
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.0'

      - name: Setup Go SDK
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/parity/go_snapshot/go.mod
          cache: false

      - name: Install parity tool dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Install dependencies
        run: dart pub get

      - name: Run process-spawning tests
        run: dart test test/bin/health_check_test.dart --concurrency=1

      - name: Run Linux Go wrapper lifecycle and parity tests
        timeout-minutes: 35
        env:
          GO_SNAPSHOT_CMD: ./scripts/run_go_snapshot.sh
        run: |
          parity_log="$RUNNER_TEMP/linux-go-parity.log"
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            dart test -r expanded test/parity --concurrency=1 \
            >"$parity_log" 2>&1
          parity_status=$?
          set -e
          cat "$parity_log"
          exit "$parity_status"

  consumer-smoke:
    name: Downstream consumer (${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.0'

      # Proves a *separate* package can depend on noir and resolve the bundled
      # native code asset with no experiment flag on the SDK floor — exercising
      # both the low-level FFI/render path and the high-level widget pipeline.
      - name: Consumer smoke (path dep on noir; no experiment flag)
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/.smoke_consumer"
          rm -rf "$APP"; mkdir -p "$APP/bin"
          printf 'name: noir_consumer\npublish_to: none\nenvironment:\n  sdk: ">=3.10.0 <4.0.0"\ndependencies:\n  noir:\n    path: ../\n' > "$APP/pubspec.yaml"
          cp "$GITHUB_WORKSPACE/example/hello.dart" "$APP/bin/hello.dart"
          printf 'import "package:noir/noir.dart";\nimport "package:noir/noir_low_level.dart";\n\nvoid main() {\n  final r = Renderer.create(20, 5, testing: true);\n  r.nextBuffer.clear(Color.black);\n  r.render(force: true);\n  r.dispose();\n  print("ffi render smoke: ok");\n}\n' > "$APP/bin/ffi_smoke.dart"
          printf 'import "package:noir/noir.dart";\nimport "hello.dart";\n\nvoid main() {\n  runTuiApp(const HelloApp(), headless: true).dispose();\n  print("widget mount smoke: ok");\n}\n' > "$APP/bin/widget_smoke.dart"
          cd "$APP"
          dart pub get
          dart analyze bin/
          echo "--- FFI + render (loads bundled native code asset) ---"
          dart run bin/ffi_smoke.dart
          echo "--- widget framework (mounts widget tree) ---"
          dart run bin/widget_smoke.dart
