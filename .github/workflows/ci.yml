name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/ bin/ hook/ scripts/

      - name: Run strict analysis
        run: dart analyze --fatal-infos

  test:
    name: Test (${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Install dependencies
        run: dart pub get

      - name: Verify bundled native assets
        run: dart run scripts/fetch_opentui_binaries.dart --verify-only

      - name: Run ordinary tests
        run: dart test --exclude-tags restricted-process-lifecycle --concurrency=1

  parity:
    name: Architecture and Go parity
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/parity/go_snapshot/go.mod
          cache: false

      - name: Install parity system dependencies
        run: sudo apt-get update && sudo apt-get install --yes pkg-config

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run architecture tests
        run: dart test test/architecture/ --concurrency=1

      - name: Run primitive and widget parity without wrapper lifecycle
        env:
          GO_SNAPSHOT_CMD: ./scripts/run_go_snapshot.sh
        run: >-
          dart test --reporter=expanded
          test/parity/primitives_parity_test.dart
          test/parity/widget_parity_test.dart
          --concurrency=1
