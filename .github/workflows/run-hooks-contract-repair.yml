name: Inspect hooks merge with latest main

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout target hooks branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/add-noir-hooks-package

      - name: Inspect merge conflicts
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_EXIT=$status"
          echo '--- status ---'
          git status --short
          echo '--- unmerged paths ---'
          git diff --name-only --diff-filter=U
          echo '--- conflict markers ---'
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!external' || true
          exit $status
