name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and release (for example, v0.0.1-alpha.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package native assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          submodules: recursive

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          version_declarations="$(grep -E '^version:' pubspec.yaml || true)"
          semver='[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z-]+([.][0-9A-Za-z-]+)*)?([+][0-9A-Za-z-]+([.][0-9A-Za-z-]+)*)?'
          if [[ ! "$version_declarations" =~ ^version:[[:space:]]+($semver)[[:space:]]*$ ]]; then
            echo "::error::pubspec.yaml must contain exactly one valid semantic version"
            exit 1
          fi
          package_version="${BASH_REMATCH[1]}"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::tag $RELEASE_TAG does not match pubspec version $package_version"
            exit 1
          fi

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Configure pub cache
        shell: bash
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-Dart-3.10.0-${{ hashFiles('pubspec.yaml') }}

      - name: Install dependencies
        timeout-minutes: 3
        run: dart pub get

      - name: Verify bundled native assets
        timeout-minutes: 2
        run: dart run scripts/fetch_opentui_binaries.dart --verify-only

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/ bin/ hook/ scripts/

      - name: Run strict analysis
        run: dart analyze --fatal-infos

      - name: Run ordinary tests
        timeout-minutes: 8
        run: dart test --concurrency=1

      - name: Validate documentation links
        run: dart doc --validate-links --output .context/dartdoc

      - name: Validate publish archive
        run: dart pub publish --dry-run

      - name: Package tracked native assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: tar -czf "opentui-binaries-$RELEASE_TAG.tar.gz" native/ native_manifest.json

      - name: Upload package-test assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentui-binaries
          path: |
            native/
            native_manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentui-binaries-release
          path: opentui-binaries-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  test-package:
    name: Test packaged assets (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Configure pub cache
        shell: bash
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Remove checkout asset copy
        shell: bash
        run: rm -rf native native_manifest.json

      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentui-binaries
          path: .

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-Dart-3.10.0-${{ hashFiles('pubspec.yaml') }}

      - name: Install dependencies
        timeout-minutes: 3
        run: dart pub get

      - name: Run packaged health check
        run: dart run noir:health_check

      - name: Build and run CLI bundle
        shell: bash
        run: |
          dart build cli -t bin/health_check.dart --output build/health-check
          cp -R build/health-check/bundle "$RUNNER_TEMP/health-check-bundle"
          rm -rf build/health-check
          case "${{ runner.os }}" in
            Windows) bundle="$RUNNER_TEMP/health-check-bundle/bin/health_check.exe" ;;
            *) bundle="$RUNNER_TEMP/health-check-bundle/bin/health_check" ;;
          esac
          "$bundle"

  release:
    name: Publish GitHub release
    needs: [verify, test-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentui-binaries-release
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: opentui-binaries-*.tar.gz
          fail_on_unmatched_files: true
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          body: |
            Bundled OpenTUI targets:

            - macOS 13.0 or later (x64, arm64)
            - Linux (x64, arm64)
            - Windows (x64, arm64)

            Install the matching pub.dev version after publication. The
            attached archive contains the native libraries and their immutable
            provenance manifest.
