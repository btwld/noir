name: Create GitHub release

# The announcement, and only the announcement. It never runs on a tag push of
# its own: `publish.yml` calls it after pub.dev has accepted the upload, so a
# release cannot appear while approval is still pending or after publication
# failed.
#
# `workflow_dispatch` stays for re-cutting a release whose creation failed
# after a successful publication. That path cannot be used to announce
# something unpublished either: the job asks pub.dev directly before it writes
# anything, so the guarantee does not depend on how the job was reached.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to announce, for example noir-v1.2.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to announce (for example, noir-v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  announce:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/noir

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          submodules: recursive

      - name: Confirm the tag exists
        shell: bash
        run: git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: '3.10.0'

      - name: Configure pub cache
        shell: bash
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-Dart-3.10.0-${{ hashFiles('pubspec.yaml', 'packages/noir/pubspec.yaml', 'packages/noir_driver/pubspec.yaml', 'packages/noir_signals/pubspec.yaml') }}

      - name: Install dependencies
        timeout-minutes: 3
        run: dart pub get

      - name: Resolve the release tag
        id: tag
        timeout-minutes: 2
        run: dart run tool/release.dart resolve-tag "$RELEASE_TAG"

      # The second gate, independent of how this job was reached. `needs:
      # publish` orders the chained path; this asks the registry itself, which
      # is what also protects a manual dispatch.
      - name: Require the version to be on pub.dev
        timeout-minutes: 5
        run: >-
          dart run tool/release.dart published "${{ steps.tag.outputs.package }}"

      # Rebuilt from the tagged checkout rather than carried between jobs:
      # these files are committed, `native:verify` has already matched them
      # against their manifest digests, and a dispatch has no earlier job to
      # inherit an artifact from.
      - name: Package tracked native assets
        shell: bash
        run: tar -czf "opentui-binaries-$RELEASE_TAG.tar.gz" native native_manifest.json LICENSE THIRD_PARTY_NOTICES.md third_party

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: packages/noir/opentui-binaries-*.tar.gz
          fail_on_unmatched_files: true
          tag_name: ${{ inputs.tag }}
          # Decided by `tool/release.dart`, from the parsed version. A release
          # tag always contains a `-` between the package name and the
          # version, so the tag text cannot answer this question.
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Bundled OpenTUI targets:

            - macOS 13.0 or later (x64, arm64)
            - Linux (x64, arm64)
            - Windows (x64, arm64)

            Install the matching pub.dev version after publication. The
            attached archive contains the native libraries and their immutable
            provenance manifest.
