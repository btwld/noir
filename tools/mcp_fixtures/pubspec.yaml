name: noir_mcp_fixtures
description: >-
  MCP servers that the Noir MCP inspector's tests start as child processes and
  build in process.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

# Only `package:mcp_dart`, deliberately. A fixture that depended on `noir`
# would inherit its native-assets build hook, and `dart run` writes hook
# progress to stdout — the MCP protocol channel. See `FINDINGS.md`, entry 16.
dependencies:
  mcp_dart: ^2.4.2

dev_dependencies:
  lints: ^6.0.0
