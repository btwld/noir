name: noir_driver
description: A flutter_driver-style client for driving a Noir terminal app headlessly, over its drive-mode VM service surface.
version: 0.0.1-alpha.0
repository: https://github.com/conceptadev/noir/tree/main/packages/noir_driver
issue_tracker: https://github.com/conceptadev/noir/issues

topics:
  - tui
  - terminal
  - testing
  - automation
  - driver

# Resolved together with the root `noir` package in this repository's Pub
# workspace. Noir carries no runtime dependency on this package.
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

platforms:
  linux:
  macos:
  windows:

dependencies:
  matcher: ^0.12.16
  meta: ^1.12.0
  noir: ^0.0.2
  vm_service: ^15.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
