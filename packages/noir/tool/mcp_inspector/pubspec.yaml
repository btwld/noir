name: noir_mcp_inspector
description: >-
  A Noir terminal application that inspects Model Context Protocol servers
  through the public mcp_dart client SDK.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  mcp_dart: 2.4.2
  noir:
    path: ../..

dev_dependencies:
  lints: ^6.0.0
  noir_mcp_fixtures:
    path: ../mcp_fixtures
  test: ^1.25.0
