name: noir_signals
description: Reusable lifecycle hooks and Signals reactive state for Noir, the Flutter-like terminal UI framework for Dart.
version: 0.0.1-alpha.0
repository: https://github.com/conceptadev/noir/tree/main/packages/noir_signals
issue_tracker: https://github.com/conceptadev/noir/issues

topics:
  - tui
  - terminal
  - hooks
  - signals
  - state

# Resolved together with the root `noir` package in this repository's Pub
# workspace. Noir has no runtime dependency on this package.
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

platforms:
  linux:
  macos:
  windows:

dependencies:
  meta: ^1.12.0
  noir: ^0.0.2
  signals_core: ^7.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
